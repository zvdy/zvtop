name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_CFLAGS: -Wno-deprecated-declarations

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go build ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall

  tag:
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-tag
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version from conventional commits
        id: next
        run: |
          set -euo pipefail
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD already tagged, nothing to do"; exit 0
          fi
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD"; last=v0.0.0; fi
          subjects=$(git log --format=%s "$range")
          bodies=$(git log --format=%b "$range")
          # chore/docs/ci/style/test/build-only changes do not produce a release.
          releasable=$(echo "$subjects" | grep -vE '^(chore|docs|ci|style|test|build)(\(.+\))?!?:' || true)
          if [ -z "$releasable" ]; then
            echo "No releasable commits since $last"; exit 0
          fi
          IFS=. read -r major minor patch <<<"${last#v}"
          # Majors are bumped manually: breaking changes only bump minor here.
          if echo "$subjects" | grep -qE '^feat(\(.+\))?!?:' || echo "$subjects$bodies" | grep -qE '(^[a-z]+(\(.+\))?!:|BREAKING CHANGE)'; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi
          tag="v$major.$minor.$patch"
          echo "Releasing $tag (previous $last)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
