name: release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and push the Docker image for (e.g. v0.2.0)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    # Manual dispatch only backfills the Docker image; the GitHub release already exists.
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reindex:
    needs: goreleaser
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Go module proxy and pkg.go.dev
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mod=github.com/zvdy/zvtop
          for i in 1 2 3 4 5; do
            if curl -fsS "https://proxy.golang.org/$mod/@v/$TAG.info"; then echo; break; fi
            echo "proxy not ready, retry $i"; sleep 15
          done
          curl -fsS -X POST "https://pkg.go.dev/fetch/$mod@$TAG" || echo "pkg.go.dev fetch request failed (non-fatal)"

  docker:
    needs: goreleaser
    # Run after a successful release, or alone when goreleaser is skipped (dispatch).
    if: ${{ !cancelled() && (needs.goreleaser.result == 'success' || needs.goreleaser.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      # Tags cut before the Dockerfile existed (backfill) borrow it from the default branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: _default
      - name: Ensure Dockerfile is present
        run: |
          for f in Dockerfile .dockerignore; do
            [ -e "$f" ] || cp "_default/$f" "$f"
          done
          rm -rf _default
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
            REVISION=${{ github.sha }}
